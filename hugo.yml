baseURL: /
languageCode: en-us
title: My New Hugo Site

module:
  imports:
    - path: github.com/hugolify/hugolify-theme-posts-tags
    - path: github.com/hugolify/hugolify-theme-posts

    - path: github.com/hugolify/hugolify-theme
    - path: github.com/hugolify/hugolify-admin


params:
  admin: 
    collections:
      posts:
        fields:
          - draft
          - date
          - title_page
          - description